# Build the site with the library checked out beside it, then upload dist/ to Cloudflare Pages.
# Runs when this repo is pushed, when the library repo is pushed (its rebuild-site workflow calls this one), or by hand.
# Both repos are public, so the checkouts need no keys. Secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/library-site
          path: library-site
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/library-wiki
          path: library-wiki
          fetch-depth: 0  # the GitHub view on the homepage dates each file from its history
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: library-site/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: library-site
      # Create fails once the project exists; the deploy step reports any real error
      - run: npx wrangler pages project create calcompute-library --production-branch main || true
        working-directory: library-site
        env: &cf
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler pages deploy dist --branch main
        working-directory: library-site
        env: *cf
